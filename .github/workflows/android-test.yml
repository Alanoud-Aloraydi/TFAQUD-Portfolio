# Builds the TFAQUD Android app as an app bundle (.aab), signs it with the
# upload key, and sends it to Google Play's internal testing track:
# Android's TestFlight. Testers on the track's email list install it from
# the Play Store through the track's opt-in link.
#
# When it runs:
#   - from ci.yml, on a push whose commit message contains [android], on
#     any branch, once the checks of that run pass. The app calls the
#     team's server on Render (https://tfaqud-api.onrender.com).
#   - from the Actions tab ("Run workflow"), once this file is on the
#     default branch; there another https address can be given. This way
#     skips the checks, so use it only on code that already passed them
#
# Every run keeps the .aab on the run's page (Artifacts) for 14 days.
# Google Play takes the very first one only by hand: Play Console, the app,
# Test and release, Internal testing, Create new release, upload it. After
# that, with PLAY_SERVICE_ACCOUNT set, each run uploads by itself.
#
# Secrets it needs (repository Settings, Secrets and variables, Actions):
#   ANDROID_KEYSTORE_BASE64     the upload key (.jks), in base64. Keep the
#                               .jks and its passwords safe outside git: Google
#                               Play knows the app by this key
#   ANDROID_KEYSTORE_PASSWORD   the password of the .jks
#   ANDROID_KEY_ALIAS           the key's alias inside it (for example upload)
#   ANDROID_KEY_PASSWORD        the key's own password
#   PLAY_SERVICE_ACCOUNT        the JSON key of a Google Cloud service account
#                               invited in Play Console (Users and permissions)
#                               with "Release apps to testing tracks". Unset,
#                               the run only builds and keeps the .aab

name: Android test

on:
  workflow_call:
    inputs:
      api_base_url:
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API address the app calls, without /api/v1 (https only)"
        required: false
        default: "https://tfaqud-api.onrender.com"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The version ci.yml checked the code with.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8

      # The Run workflow field, else the server on Render. A release build
      # sends no plain http, so a laptop's address will not work here.
      - name: Create .env
        env:
          INPUT_API: ${{ inputs.api_base_url }}
        run: |
          API_BASE_URL="${INPUT_API:-https://tfaqud-api.onrender.com}"
          echo "The app will call: $API_BASE_URL"
          cp .env.example .env
          sed -i "s#^API_BASE_URL=.*#API_BASE_URL=${API_BASE_URL}#" .env

      # build.gradle.kts signs with the upload key when key.properties is
      # there. Both files are made here and never committed.
      - name: Write the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::The signing secrets are missing. See the top of .github/workflows/android-test.yml."
            exit 1
          fi
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Get packages
        run: flutter pub get

      # Every build needs a higher version code, whether ci.yml or Run
      # workflow started it: the minutes since 1 January 2026 (1767225600)
      # always go up.
      - name: Build the app bundle
        run: flutter build appbundle --release --build-number=$(( ($(date +%s) - 1767225600) / 60 ))

      - name: Keep the app bundle on this run's page
        uses: actions/upload-artifact@v4
        with:
          name: tfaqud-android
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Google's own client library, not a third-party action.
      - name: Send it to Google Play internal testing
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::notice::No PLAY_SERVICE_ACCOUNT yet: the .aab is under this run's Artifacts. See the top of .github/workflows/android-test.yml."
            exit 0
          fi
          pip install --quiet google-api-python-client google-auth
          # The release notes the testers read: the commit's first line.
          NOTES=$(printf '%s' "${COMMIT_MESSAGE:-Manual build}" | head -n 1)
          python ../.github/scripts/play_internal.py \
            build/app/outputs/bundle/release/app-release.aab "$NOTES"
