publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc: ^9.2.1
  # Pinned: the bottom bar packages are young; upgrade only after reviewing
  # the diff.
  crystal_navigation_bar: 2.0.0
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
