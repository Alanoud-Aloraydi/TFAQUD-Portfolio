name: app
description: "TFAQUD care-circle app (iPhone, Arabic)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  bloc: ^9.2.1
  # Pinned: the bottom bar packages are young; upgrade only after reviewing
  # the diff.
  crystal_navigation_bar: 2.0.0
  cupertino_icons: ^2.0.0
  phosphor_flutter: 2.1.0
  device_calendar_plus: ^0.12.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  # The dose reminders, set on the phone itself (no push server needed).
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  get_storage: ^2.1.1
  go_router: ^18.1.0
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  loading_animation_widget: ^1.3.0
  multiple_result: ^5.3.0
  native_glass_navbar: 1.2.0
  package_info_plus: ^10.2.2
  # The app's Library folder, where the notification sound is copied for
  # iOS to find it (see phone_notifications.dart).
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  record: ^7.1.2
  just_audio: ^0.10.6
  image_picker: ^1.1.2
  sizer: ^3.1.3
  # The moments of the reminders (flutter_local_notifications takes them
  # in this package's type), and each patient's clock with its DST rules.
  timezone: ^0.11.0
  # The phone's own IANA zone, the first guess of a new patient's zone
  # (features/circles/data/datasources/device_zone.dart).
  flutter_timezone: ^5.1.1
  # Calls from the emergency card: a contact, and the ambulance (997).
  url_launcher: ^6.3.1
  uuid: ^4.6.0
  # Reads a simplified-mode screen aloud («استماع»); iOS's own
  # AVSpeechSynthesizer, so Arabic speech works fully offline.
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The device smoke flow (integration_test/), run on emulators and
  # simulators by .github/workflows/device-matrix.yml.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.3
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1

flutter:
  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/avatars/
    - assets/sounds/
    - .env
  uses-material-design: true

  # IBM Plex Sans Arabic (SIL Open Font License 1.1, see assets/fonts/OFL.txt).
  # The design system uses weights 400 to 700 only.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
