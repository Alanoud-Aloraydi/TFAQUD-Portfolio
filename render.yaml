# Render Blueprint: the TFAQUD API and its PostgreSQL database, as the team's
# shared test server (APP_ENV=staging): fake sign-in codes that only the team
# reads in Render's log, and the demo data.
#
# In Render: New, then Blueprint, then pick this repository and the branch to
# deploy. Render reads this file, asks for the values marked `sync: false`,
# and creates both. Each push to that branch deploys the API again by itself;
# the start command runs the new database migrations first.
#
# backend/README.md ("Deploy to Render") has the steps.

databases:
  - name: tfaqud-db
    plan: free
    # The region nearest to Saudi Arabia that Render has.
    region: frankfurt
    databaseName: tfaqud
    user: tfaqud
    postgresMajorVersion: "16"

services:
  - type: web
    runtime: docker
    name: tfaqud-api
    plan: free
    region: frankfurt
    # The paths are from the top of the repository (no rootDir, so they mean
    # the same in every Render setting). Only changes to the server deploy it.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tfaqud-db
          property: connectionString
      # No SMS is sent: the code is written in Render's log ("FAKE SMS ...
      # Your code is ..."), which only the team can read. For real SMS, set
      # SMS_BACKEND to authentica and add AUTHENTICA_API_KEY in Render.
      - key: SMS_BACKEND
        value: fake
      - key: FAKE_SMS_LOG_CODES
        value: "true"
      # Make the demo circles, medicines and doses at the start when they are
      # not there yet (sign in with 0500000001).
      - key: DEMO_DATA
        value: "true"
      # Apple push. Type "none" first; after the key file is added as the
      # secret file apns_key.p8, change it to "apns".
      - key: PUSH_BACKEND
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        value: com.tfaqud.tfaqud
      - key: APNS_PRIVATE_KEY_PATH
        value: /etc/secrets/apns_key.p8
      # TestFlight and the App Store use Apple's production push service.
      - key: APNS_ENVIRONMENT
        value: production
      # The scheduler (a GitHub Actions cron, see .github/workflows) calls
      # POST /internal/tick with this value as the X-Tick-Secret header.
      - key: TICK_SECRET
        sync: false
