# Render Blueprint: the TFAQUD API and its PostgreSQL database, as the team's
# shared test server (APP_ENV=staging), with real sign-in codes by SMS
# (Authentica).
#
# In Render: New, then Blueprint, then pick this repository and a branch.
# Render reads this file from that branch, asks for the values marked
# `sync: false`, and creates both. The API itself always deploys from main
# (`branch: main` below), so only what is merged into main reaches the
# server: a push to main deploys the API again by itself once every GitHub
# check on the commit has passed (.github/workflows/ci.yml); a failed check,
# or a commit with no checks, deploys nothing. The start command runs the new
# database migrations first.
#
# backend/README.md ("Deploy to Render") has the steps.

databases:
  - name: tfaqud-db
    plan: free
    # The region nearest to Saudi Arabia that Render has.
    region: frankfurt
    databaseName: tfaqud
    user: tfaqud
    postgresMajorVersion: "16"

services:
  - type: web
    runtime: docker
    name: tfaqud-api
    # Deploy only what is merged into main (through a pull request), whatever
    # branch the Blueprint reads this file from.
    branch: main
    plan: free
    region: frankfurt
    # The paths are from the top of the repository (no rootDir, so they mean
    # the same in every Render setting). Only changes to the server deploy it.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true
      # Cloudflare in front of Render puts the caller's address here; the
      # server caps the sign-in codes one network may ask for with it.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: DATABASE_URL
        fromDatabase:
          name: tfaqud-db
          property: connectionString
      # Real sign-in codes by SMS through Authentica. The key is typed in
      # Render (Environment), never in git. For codes in Render's log instead,
      # set SMS_BACKEND to fake and FAKE_SMS_LOG_CODES to "true".
      - key: SMS_BACKEND
        value: authentica
      - key: AUTHENTICA_API_KEY
        sync: false
      - key: FAKE_SMS_LOG_CODES
        value: "false"
      # The demo accounts (0500000001 detailed, 0500000004 simplified):
      # their numbers are made up, so they get no SMS and sign in with
      # DEMO_SIGN_IN_CODE, six digits typed in Render (Environment), never
      # in git. The start makes the demo when it is missing, and
      # .github/workflows/demo-refresh.yml makes it fresh each morning.
      # Without the code, nothing of the demo runs.
      - key: DEMO_DATA
        value: "true"
      - key: DEMO_SIGN_IN_CODE
        sync: false
      # Pushes to iOS and Android through OneSignal: "onesignal", once
      # ONESIGNAL_API_KEY (the OneSignal app's App API key, a secret typed
      # in Render only) is set; "none" sends nothing.
      - key: PUSH_BACKEND
        sync: false
      # The OneSignal app's id: not a secret (the app has it too).
      - key: ONESIGNAL_APP_ID
        value: 50e5581f-1938-47b7-a23a-c65c70c4a26d
      - key: ONESIGNAL_API_KEY
        sync: false
      # The X-Tick-Secret header of POST /internal/tick, /internal/metrics
      # and /internal/demo-data (.github/workflows/demo-refresh.yml).
      - key: TICK_SECRET
        sync: false

  # The scheduled notification scan (backend/app/push/scheduled.py): every
  # 10 minutes, a missed dose, measurement or appointment, and a task put
  # off that came again, each told once. Its own short-lived process from
  # the API's image, so it runs even while the free API sleeps. A cron job
  # costs at least $1 a month, billed by the second it runs.
  - type: cron
    name: tfaqud-tick
    runtime: docker
    branch: main
    plan: starter
    region: frankfurt
    schedule: "*/10 * * * *"
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: flask --app wsgi tick
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: tfaqud-db
          property: connectionString
      # The scan sends no SMS: no Authentica key here.
      - key: SMS_BACKEND
        value: fake
      # The same secret key and push settings as the API.
      - key: SECRET_KEY
        fromService:
          type: web
          name: tfaqud-api
          envVarKey: SECRET_KEY
      - key: PUSH_BACKEND
        fromService:
          type: web
          name: tfaqud-api
          envVarKey: PUSH_BACKEND
      - key: ONESIGNAL_APP_ID
        fromService:
          type: web
          name: tfaqud-api
          envVarKey: ONESIGNAL_APP_ID
      - key: ONESIGNAL_API_KEY
        fromService:
          type: web
          name: tfaqud-api
          envVarKey: ONESIGNAL_API_KEY
